<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183d32" />
    <script>
      try {
        const saved = localStorage.getItem("elo-theme");
        document.documentElement.dataset.theme =
          saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
    <meta
      name="description"
      content="Elo — conversas que conectam. Sua operação, seu contexto, uma experiência."
    />
    <title>Elo · Conversas que conectam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
