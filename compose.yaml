services:
  elo:
    build: .
    ports:
      - "${ELO_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://elo:elo-local-password@db:5432/elo
      PUBLIC_URL: ${ELO_PUBLIC_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ELO_PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elo
      POSTGRES_PASSWORD: elo-local-password
      POSTGRES_DB: elo
    volumes:
      - elo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elo -d elo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  elo-postgres:
